<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#752a1f">
  <title>{% block title %}Conta | Restaurante Dona Maria Betim{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="brand" href="{{ url_for('site.inicio') }}" aria-label="Restaurante Dona Maria, início">
      <span class="brand-mark" aria-hidden="true">DM</span>
      <span class="brand-name">Dona Maria<span>Restaurante e Petiscaria</span></span>
    </a>
  </header>

  <main class="auth-main">
    {% with avisos = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensagem in avisos %}
      <p class="flash-message flash-{{ categoria }}" role="status">{{ mensagem }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="auth-footer">
    <a href="{{ url_for('site.inicio') }}">← Voltar ao site</a>
  </footer>
</body>
</html>
